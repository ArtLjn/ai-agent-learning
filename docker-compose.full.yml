# docker-compose.full.yml
#
# 完整毕设场景编排：主系统 + rag-service + 共享 Qdrant
# 用法：docker-compose -f docker-compose.full.yml up -d
#
# 端口约定（与 design-spec 一致）：
# - 主系统 ai-agent-learning：host 8000 → container 8000
# - rag-service：host 8001 → container 8001
# - Qdrant：host 6333 → container 6333
#
# 注意：单独 `docker-compose up`（不带 -f）仍使用主项目 docker-compose.yml，
# 其中主系统 host 端口为 8001（历史配置），与 rag-service 冲突。
# 完整演示场景请使用本文件。

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: full-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_shared:/qdrant/storage
    restart: unless-stopped

  api:
    build:
      context: .
      args:
        - PIP_INDEX_URL=https://pypi.org/simple
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - RAG_SERVICE_URL=http://rag-service:8001
      - CACHE_ENABLED=true
      - CACHE_MAX_SIZE=512
      - CACHE_TTL=300
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped

  rag-service:
    build:
      context: ../rag-service
    container_name: full-rag-service
    ports:
      - "8001:8001"
    depends_on:
      - qdrant
    environment:
      - PORT=8001
      - QDRANT_URL=http://qdrant:6333
      - EMBEDDING_MODEL=BAAI/bge-large-zh-v1.5
      - RERANKER_MODEL=BAAI/bge-reranker-v2-m3
      - DEFAULT_CHUNK_SIZE=500
      - DEFAULT_TOP_K=10
      - RRF_K=60
      - RRF_VECTOR_WEIGHT=0.7
      - RRF_SPARSE_WEIGHT=0.3
      - HTTP_TIMEOUT=10
    restart: unless-stopped

volumes:
  qdrant_shared:
